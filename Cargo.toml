[package]
name = "cadrum_web"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Node",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
cadrum = "^0.8.17"

# Size optimization for the final wasm (rust side only; OCCT/C++ is handled by cc).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
